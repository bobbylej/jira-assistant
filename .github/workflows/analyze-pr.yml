name: Analyze Pull Request

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  analyze-pull-request:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    outputs:
      code-diff: ${{ steps.get-diff.outputs.diff }}
      jira-ticket: ${{ steps.get-jira-ticket-id.outputs.ticket }}
      jira-details: ${{ steps.get-jira-details.outputs.details }}
      analysis: ${{ steps.analyze-pr.outputs.analysis }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Jira ticket ID
        id: get-jira-ticket-id
        run: |
          # Check if Jira project key is set
          if [ -z "$JIRA_PROJECT_KEY" ]; then
            echo "JIRA_PROJECT_KEY environment variable is not set"
            echo "ticket=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get PR title and branch name
          PR_TITLE="${{ github.event.pull_request.title }}"
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"

          # Run the Jira ticket extraction script
          TICKET_ID=$(./scripts/get-jira-ticket-id/get-jira-ticket-id.sh "$JIRA_PROJECT_KEY" "$PR_TITLE" "$BRANCH_NAME")

          # Set output
          echo "ticket=$TICKET_ID" >> $GITHUB_OUTPUT
        env:
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}

      - name: Get Jira ticket details
        id: get-jira-details
        if: steps.get-jira-ticket-id.outputs.ticket != ''
        run: |
          # Check if Jira credentials are available
          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_USER_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "Jira credentials not configured, skipping ticket details"
            echo "details=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get ticket details using the JavaScript script
          TICKET_DETAILS=$(node ./scripts/get-jira-ticket-details/get-jira-ticket-details.js "${{ steps.get-jira-ticket-id.outputs.ticket }}")

          # Set output
          echo "details<<EOF" >> $GITHUB_OUTPUT
          echo "$TICKET_DETAILS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ vars.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Get PR diff
        id: get-diff
        run: |
          # Get the full diff
          DIFF=$(git diff ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})

          # Set output
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Analyze PR Changes
        id: analyze-pr
        if: steps.get-diff.outputs.diff != ''
        run: |
          # Create temporary files for the inputs
          cat > /tmp/git_diff.txt << 'EOF'
          ${{ steps.get-diff.outputs.diff }}
          EOF
          cat > /tmp/jira_details.txt << 'EOF'
          ${{ steps.get-jira-details.outputs.details }}
          EOF

          # Analyze PR using Claude AI
          ANALYSIS=$(node ./scripts/analyze-pr/analyze-pr.js "$(cat /tmp/git_diff.txt)" "$(cat /tmp/jira_details.txt)")

          # Clean up temporary files
          rm -f /tmp/git_diff.txt /tmp/jira_details.txt

          # Set output
          echo "analysis<<EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          DEBUG: "true"

      - name: Comment PR with Analysis
        if: steps.analyze-pr.outputs.analysis != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.ANALYSIS_CONTENT
            })
        env:
          ANALYSIS_CONTENT: ${{ steps.analyze-pr.outputs.analysis }}
